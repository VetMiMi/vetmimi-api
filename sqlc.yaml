version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: internal/db/queries
    gen:
      go:
        package: db
        out: internal/db
        sql_package: pgx/v5
        emit_json_tags: false
        emit_interface: true
        emit_empty_slices: true
        overrides:
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: database/sql
              type: NullTime
          # The localized domain over jsonb (docs/data-model.md, "Conventions").
          - db_type: localized
            go_type:
              import: encoding/json
              type: RawMessage
          - db_type: localized
            nullable: true
            go_type:
              import: encoding/json
              type: RawMessage
