# coturn for video sessions (ADR-007). The shared secret and the external IP
# are passed on the command line by docker-compose.yml; this file holds no
# secret and never enables lt-cred-mech or static users.
# deploy/test-compose.sh checks the guards below.

listening-port=3478
# The range the security group opens (deploy/terraform/live).
min-port=49160
max-port=49200
realm=vetmimi
use-auth-secret
fingerprint
no-cli
no-multicast-peers
# TURN over TLS on 5349 is not offered.
no-tls
no-dtls
no-tlsv1
no-tlsv1_1
log-file=stdout
simple-log

# A relay must never reach the host's own network, the Docker networks or
# the instance metadata address.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
