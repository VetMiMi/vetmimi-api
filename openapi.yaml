            application/json:
              schema:
                $ref: "#/components/schemas/PublicFeaturedArea"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    serviceKey:
      type: apiKey
      in: header
      name: X-Service-Key
      description: >-
        Shared secret held by the Next.js server. Required on `/public/*` and `POST /auth/sessions`.
        Requests with a valid key may carry `X-Visitor-IP`, the visitor's address, which public rate
        limits use.
    sessionToken:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: >-
        Session token from `POST /auth/sessions`. Required on `/admin/*` and `/auth/*` except
        sign-in.
  parameters:
    AppointmentId:
      name: appointmentId
      in: path
      required: true
      description: Appointment id.
      schema:
        type: string
        format: uuid
    ServiceId:
      name: serviceId
      in: path
      required: true
      description: Service id.
      schema:
        type: string
        format: uuid
    RuleId:
      name: ruleId
      in: path
      required: true
      description: Availability rule id.
      schema:
        type: string
        format: uuid
    OverrideId:
      name: overrideId
      in: path
      required: true
      description: Availability override id.
      schema:
        type: string
        format: uuid
    BlockId:
      name: blockId
      in: path
      required: true
      description: Availability block id.
      schema:
        type: string
        format: uuid
    CommunicationId:
      name: communicationId
      in: path
      required: true
      description: Communication id.
      schema:
        type: string
        format: uuid
    StoryId:
      name: storyId
      in: path
      required: true
      description: Story id.
      schema:
        type: string
        format: uuid
    ServicePageId:
      name: servicePageId
      in: path
      required: true
      description: Service page id.
      schema:
        type: string
        format: uuid
    PortfolioItemId:
      name: portfolioItemId
      in: path
      required: true
      description: Portfolio item id.
      schema:
        type: string
        format: uuid
    PageId:
      name: pageId
      in: path
      required: true
      description: Page id.
      schema:
        type: string
        format: uuid
    SectionId:
      name: sectionId
      in: path
      required: true
      description: Page section id.
      schema:
        type: string
        format: uuid
    MediaId:
      name: mediaId
      in: path
      required: true
      description: Media id.
      schema:
        type: string
        format: uuid
    FacebookPostId:
      name: facebookPostId
      in: path
      required: true
      description: Facebook post record id.
      schema:
        type: string
        format: uuid
    EnquiryId:
      name: enquiryId
      in: path
      required: true
      description: Contact enquiry id.
      schema:
        type: string
        format: uuid
    RoomId:
      name: roomId
      in: path
      required: true
      description: Video room id.
      schema:
        type: string
        format: uuid
    ContentVersion:
      name: contentVersion
      in: path
      required: true
      description: Version number to restore.
      schema:
        type: integer
        minimum: 1
    Slug:
      name: slug
      in: path
      required: true
      description: >-
        Readable slug. An old slug of a published record resolves to the record; the response's
        `slug` is the current one so the site can redirect.
      schema:
        type: string
        pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
        maxLength: 120
    PageSlug:
      name: slug
      in: path
      required: true
      description: "Page slug, e.g. `home`, `about`, `contact`, `privacy`."
      schema:
        type: string
        pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
        maxLength: 60
    ManagementToken:
      name: token
      in: path
      required: true
      description: Management link token (43 base64url characters). Invalid and expired tokens both give 404.
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{43}$"
    JoinToken:
      name: token
      in: path
      required: true
      description: Video join token from the visitor's email (43 base64url characters).
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{43}$"
    FeaturedArea:
      name: area
      in: path
      required: true
      description: Featured area.
      schema:
        $ref: "#/components/schemas/FeaturedAreaName"
    Locale:
      name: locale
      in: query
      required: false
      description: "Language of the localised fields; English is the fallback."
      schema:
        $ref: "#/components/schemas/Locale"
    Cursor:
      name: cursor
      in: query
      required: false
      description: "Opaque cursor from a previous page's `nextCursor`."
      schema:
        type: string
        maxLength: 200
    Limit:
      name: limit
      in: query
      required: false
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Search:
      name: q
      in: query
      required: false
      description: Case-insensitive search text.
      schema:
        type: string
        maxLength: 100
    PublicationStatusFilter:
      name: publicationStatus
      in: query
      required: false
      description: Filter by publication status (repeatable).
      schema:
        type: array
        items:
          $ref: "#/components/schemas/PublicationStatus"
      style: form
      explode: true
    ApprovalStatusFilter:
      name: approvalStatus
      in: query
      required: false
      description: Filter by approval status (repeatable).
      schema:
        type: array
        items:
          $ref: "#/components/schemas/ApprovalStatus"
      style: form
      explode: true
    FeaturedFilter:
      name: featured
      in: query
      required: false
      description: Only records that are, or are not, in a featured area.
      schema:
        type: boolean
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Client-generated UUID, reused for retries of the same submission. A repeat with the same
        body within 24 hours returns the stored response; with a different body it returns `422
        idempotency_key_reused`.
      schema:
        type: string
        format: uuid
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      description: "Optional client-generated UUID; same semantics as for appointment requests."
      schema:
        type: string
        format: uuid
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details, returned by every 4xx and 5xx response.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          description: "URI identifying the problem type: `urn:vetmimi:problem:<code>`."
          format: uri
        title:
          type: string
          description: Short summary of the problem type.
        status:
          type: integer
          description: HTTP status code.
          minimum: 400
          maximum: 599
        detail:
          type: string
          description: "Explanation for an administrator or developer; never shown raw to visitors."
        code:
          type: string
          description: "Stable machine-readable code, e.g. `slot_unavailable`."
          pattern: "^[a-z_]+$"
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
                description: JSON pointer or parameter name.
              message:
                type: string
            additionalProperties: false
          description: Field-level problems.
    SlotUnavailableProblem:
      description: "A `Problem` with code `slot_unavailable` and nearby free slots."
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [alternatives]
          properties:
            alternatives:
              type: array
              items:
                $ref: "#/components/schemas/Slot"
              description: Up to five free slots on the same or following days.
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
      additionalProperties: false
    Readiness:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        checks:
          type: object
          required: [postgres, redis]
          properties:
            postgres:
              type: string
              enum: [ok, fail]
            redis:
              type: string
              enum: [ok, fail]
          additionalProperties: false
      additionalProperties: false
    Locale:
      type: string
      description: "Site language: English or Burmese."
      enum: [en, my]
      default: en
    LocalizedText:
      type: object
      description: "Text per locale. Required fields need `en`."
      properties:
        en:
          type: string
          maxLength: 20000
        my:
          type: string
          maxLength: 20000
      additionalProperties: false
    RichTextDocument:
      type: object
      description: "Portable rich text as a TipTap document (ADR-008); never HTML."
      required: [type]
      properties:
        type:
          type: string
          enum: [doc]
        content:
          type: array
          items:
            type: object
    LocalizedRichText:
      type: object
      description: A rich text document per locale.
      properties:
        en:
          $ref: "#/components/schemas/RichTextDocument"
        my:
          $ref: "#/components/schemas/RichTextDocument"
      additionalProperties: false
    Timezone:
      type: string
      description: IANA timezone name of the practice.
      examples: [Australia/Sydney]
    Version:
      type: integer
      description: Row version for optimistic concurrency.
      minimum: 1
    Role:
      type: string
      enum: [content_editor, booking_admin, site_admin]
    Permission:
      type: string
      enum: [not_required, pending, approved, refused]
    Format:
      type: string
      description: Appointment format. Online only at launch.
      enum: [online, in_person]
    Slot:
      type: object
      description: "A bookable time; `endsAt` is the session end, buffers excluded."
      required: [startsAt, endsAt]
      properties:
        startsAt:
          type: string
          description: UTC timestamp (RFC 3339).
          format: date-time
        endsAt:
          type: string
          description: UTC timestamp (RFC 3339).
          format: date-time
      additionalProperties: false
    SlotDay:
      type: object
      required: [date, slots]
      properties:
        date:
          type: string
          description: Calendar date in the practice timezone.
          format: date
        slots:
          type: array
          items:
            $ref: "#/components/schemas/Slot"
      additionalProperties: false
    SessionCreate:
      type: object
      required: [email, password, totpCode]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 12
          maxLength: 200
          format: password
        totpCode:
          type: string
          pattern: "^[0-9]{6}$"
      additionalProperties: false
    CurrentUser:
      type: object
      required: [id, email, displayName, roles, isPractitioner]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
          minItems: 1
        isPractitioner:
          type: boolean
      additionalProperties: false
    SessionCreated:
      type: object
      required: [token, expiresAt, user]
      properties:
        token:
          type: string
          description: "Opaque session token (`vms_` + 43 base64url characters). Shown once."
          pattern: "^vms_[A-Za-z0-9_-]{43}$"
        expiresAt:
          type: string
          description: "Absolute expiry; the session also ends after 12 hours idle."
          format: date-time
        user:
          $ref: "#/components/schemas/CurrentUser"
      additionalProperties: false
    Settings:
      type: object
      description: >-
        All settings; keys are the camelCase form of the `settings` table keys. A content editor
        receives only the `site` group (timezone, retentionMonths, contactEmail, responseTime);
        booking and site administrators receive every key. `updatedAt` is the newest change among
        the keys returned.
      required:
        - timezone
        - retentionMonths
        - contactEmail
        - responseTime
      properties:
        timezone:
          $ref: "#/components/schemas/Timezone"
        bookingMode:
          type: string
          enum: [request_approval, instant]
        publicBookingEnabled:
          type: boolean
          description: False pauses public booking without touching availability.
        pendingHoldHours:
          type: integer
          minimum: 1
          maximum: 168
        reminderHours:
          type: integer
          minimum: 1
          maximum: 168
        minNoticeHours:
          type: integer
          minimum: 0
          maximum: 720
        maxAdvanceDays:
          type: integer
          minimum: 1
          maximum: 365
        slotStepMinutes:
          type: integer
          minimum: 5
          maximum: 120
        cancellationNoticeHours:
          type: integer
          minimum: 0
          maximum: 168
        lateCancellationFeePercent:
          type: integer
          minimum: 0
          maximum: 100
        lateCancellationFirstWaived:
          type: boolean
        noShowFeePercent:
          type: integer
          minimum: 0
          maximum: 100
        meetingLinkMode:
          type: string
          enum: [vetmimi_room, manual_link]
        paymentMethods:
          type: array
          items:
            type: string
            enum: [bank_transfer, card]
          minItems: 1
          uniqueItems: true
        invoiceTiming:
          type: string
          enum: [after_session]
        retentionMonths:
          type: integer
          minimum: 6
          maximum: 120
        contactEmail:
          type: string
          format: email
        responseTime:
          $ref: "#/components/schemas/LocalizedText"
        updatedAt:
          type: string
          description: UTC timestamp (RFC 3339).
          format: date-time
      additionalProperties: false
    SettingsPatch:
      type: object
      description: >-
        Keys to change, applied together or not at all. `booking` keys need booking_admin; `site`
        keys need site_admin.
      minProperties: 1
      properties:
        timezone:
          $ref: "#/components/schemas/Timezone"
        bookingMode:
          type: string
          enum: [request_approval, instant]
        publicBookingEnabled:
          type: boolean
          description: False pauses public booking without touching availability.
        pendingHoldHours:
          type: integer
          minimum: 1
          maximum: 168
        reminderHours:
          type: integer
          minimum: 1
          maximum: 168
        minNoticeHours:
          type: integer
          minimum: 0
          maximum: 720
        maxAdvanceDays:
          type: integer
          minimum: 1
          maximum: 365
        slotStepMinutes:
          type: integer
          minimum: 5
          maximum: 120
        cancellationNoticeHours:
          type: integer
          minimum: 0
          maximum: 168
        lateCancellationFeePercent:
          type: integer
          minimum: 0
          maximum: 100
        lateCancellationFirstWaived:
          type: boolean
        noShowFeePercent:
          type: integer
          minimum: 0
          maximum: 100
        meetingLinkMode:
          type: string
          enum: [vetmimi_room, manual_link]
        paymentMethods:
          type: array
          items:
            type: string
            enum: [bank_transfer, card]
          minItems: 1
          uniqueItems: true
        invoiceTiming:
          type: string
          enum: [after_session]
        retentionMonths:
          type: integer
          minimum: 6
          maximum: 120
        contactEmail:
          type: string
          format: email
        responseTime:
          $ref: "#/components/schemas/LocalizedText"
      additionalProperties: false
    BookingAction:
      type: string
      enum: [book, request, enquiry_only, not_bookable]
    ServiceState:
      type: string
      enum: [active, paused, archived]
    Service:
      type: object
      required:
        - id
