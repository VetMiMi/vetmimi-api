          minimum: 5
          maximum: 480
        bufferBeforeMinutes:
          type: integer
          minimum: 0
          maximum: 240
        bufferAfterMinutes:
          type: integer
          minimum: 0
          maximum: 240
        formats:
          type: array
          items:
            $ref: "#/components/schemas/Format"
          minItems: 1
          uniqueItems: true
        feeText:
          $ref: "#/components/schemas/LocalizedText"
        preparationText:
          $ref: "#/components/schemas/LocalizedText"
        sortOrder:
          type: integer
      additionalProperties: false
    ServicePatch:
      type: object
      required: [version]
      properties:
        version:
          $ref: "#/components/schemas/Version"
        slug:
          type: string
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
          maxLength: 120
        name:
          $ref: "#/components/schemas/LocalizedText"
        description:
          $ref: "#/components/schemas/LocalizedText"
        bookingAction:
          $ref: "#/components/schemas/BookingAction"
        durationMinutes:
          type: integer
          minimum: 5
          maximum: 480
        bufferBeforeMinutes:
          type: integer
          minimum: 0
          maximum: 240
        bufferAfterMinutes:
          type: integer
          minimum: 0
          maximum: 240
        formats:
          type: array
          items:
            $ref: "#/components/schemas/Format"
          minItems: 1
          uniqueItems: true
        feeText:
          $ref: "#/components/schemas/LocalizedText"
        preparationText:
          $ref: "#/components/schemas/LocalizedText"
        sortOrder:
          type: integer
        state:
          $ref: "#/components/schemas/ServiceState"
      additionalProperties: false
    ServiceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Service"
      additionalProperties: false
    VersionedAction:
      type: object
      required: [version]
      properties:
        version:
          $ref: "#/components/schemas/Version"
      additionalProperties: false
    AvailabilityRuleInput:
      type: object
      required: [weekday, startTime, endTime]
      properties:
        weekday:
          type: integer
          description: "ISO weekday, 1 = Monday … 7 = Sunday."
          minimum: 1
          maximum: 7
        startTime:
          type: string
          description: "Local time `HH:MM` in the practice timezone."
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        endTime:
          type: string
          description: "Local time `HH:MM` in the practice timezone."
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
      additionalProperties: false
    AvailabilityRule:
      type: object
      required: [weekday, startTime, endTime, id]
      properties:
        weekday:
          type: integer
          description: "ISO weekday, 1 = Monday … 7 = Sunday."
          minimum: 1
          maximum: 7
        startTime:
          type: string
          description: "Local time `HH:MM` in the practice timezone."
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        endTime:
          type: string
          description: "Local time `HH:MM` in the practice timezone."
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
