        websocketUrl:
          type: string
          description: "`wss://…/video/rooms/{roomId}/ws` without the ticket."
          format: uri
        iceServers:
          type: array
          items:
            $ref: "#/components/schemas/IceServer"
          description: Google STUN and our TURN with credentials valid to the room's close.
      additionalProperties: false
    EnquiryType:
      type: string
      enum:
        - collaboration
        - workshop
        - speaking
        - art_of_wellness
        - media
        - organisation
        - general
    ContactEnquiryCreate:
      type: object
      required: [name, email, enquiryType, message, locale, privacyAcknowledged]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        organisation:
          type: string
          maxLength: 200
        enquiryType:
          $ref: "#/components/schemas/EnquiryType"
        service:
          type: string
          description: Service slug when sent from an enquiry-only service.
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
        subject:
          type: string
          maxLength: 200
        message:
          type: string
          minLength: 1
          maxLength: 5000
        locale:
          $ref: "#/components/schemas/Locale"
        privacyAcknowledged:
          type: boolean
          enum: [true]
      additionalProperties: false
    ContactEnquiryReceipt:
      type: object
      required: [reference, createdAt]
      properties:
        reference:
          type: string
        createdAt:
          type: string
          description: UTC timestamp (RFC 3339).
          format: date-time
      additionalProperties: false
    ContactEnquiry:
      type: object
      required:
        - id
        - reference
        - name
        - email
        - enquiryType
        - message
        - locale
        - status
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        reference:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        organisation:
          type: string
        enquiryType:
          $ref: "#/components/schemas/EnquiryType"
        service:
          $ref: "#/components/schemas/ServiceRef"
        subject:
          type: string
        message:
          type: string
        locale:
          $ref: "#/components/schemas/Locale"
        status:
          type: string
          enum: [new, handled]
        handledAt:
          type: string
          description: UTC timestamp (RFC 3339).
          format: date-time
        handledBy:
          type: string
          format: uuid
        createdAt:
          type: string
          description: UTC timestamp (RFC 3339).
          format: date-time
      additionalProperties: false
    ContactEnquiryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ContactEnquiry"
        nextCursor:
          type: string
      additionalProperties: false
    PostKind:
      type: string
      description: "`insight` (Daw Mi's writing), `true_story` (a person's lived experience, which needs their consent) or `announcement`."
      enum: [insight, true_story, announcement]
    PostStatus:
      type: string
      description: >-
        idea → draft → in_review → approved → scheduled → publishing → published, or archived from any
        status. `publishing` means some enabled channel is not published yet.
      enum: [idea, draft, in_review, approved, scheduled, publishing, published, archived]
    DraftStatus:
      type: string
      description: The two statuses an author moves a post between before submitting it.
      enum: [idea, draft]
    Channel:
      type: string
      enum: [website, facebook, instagram, linkedin]
    SocialChannel:
      type: string
      enum: [facebook, instagram, linkedin]
    PublicationStatus:
      type: string
      description: "`manual` = posted by hand (copy & open)."
      enum: [pending, publishing, published, failed, manual]
    LocalizedMarkdown:
      type: object
      description: "Markdown per locale, stored as written; the site renders it safely."
      properties:
        en:
          type: string
          maxLength: 100000
        my:
          type: string
          maxLength: 100000
      additionalProperties: false
    WebsiteVersion:
      type: object
      description: The article on the website. Approval needs a slug and English title, excerpt and body.
      required: [enabled]
      properties:
        enabled:
          type: boolean
        slug:
          type: string
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
          maxLength: 120
        title:
          $ref: "#/components/schemas/LocalizedText"
        excerpt:
          $ref: "#/components/schemas/LocalizedText"
        body:
          $ref: "#/components/schemas/LocalizedMarkdown"
        coverImageId:
          type: string
          description: Media library id.
          format: uuid
        seoTitle:
          $ref: "#/components/schemas/LocalizedText"
        seoDescription:
          $ref: "#/components/schemas/LocalizedText"
      additionalProperties: false
    FacebookVersion:
      type: object
      description: A Facebook Page post. Approval needs text.
      required: [enabled]
      properties:
        enabled:
          type: boolean
        text:
          type: string
          maxLength: 10000
        link:
          type: string
          format: uri
          maxLength: 2000
        imageIds:
          type: array
          description: Media library ids, in order.
          maxItems: 10
          items:
            type: string
            format: uuid
      additionalProperties: false
    InstagramVersion:
      type: object
      description: >-
        An Instagram Business post. Approval needs at least one image and a caption of at most 2,200
        characters and 30 hashtags.
      required: [enabled]
      properties:
        enabled:
          type: boolean
        caption:
          type: string
          maxLength: 10000
        imageIds:
          type: array
          description: Media library ids, in order.
          maxItems: 10
          items:
            type: string
            format: uuid
      additionalProperties: false
    LinkedInVersion:
      type: object
      description: A LinkedIn profile post. Approval needs text of at most 3,000 characters.
      required: [enabled]
      properties:
        enabled:
          type: boolean
        text:
          type: string
          maxLength: 10000
        link:
          type: string
          format: uri
          maxLength: 2000
        imageIds:
          type: array
          description: Media library ids, in order.
          maxItems: 1
          items:
            type: string
            format: uuid
      additionalProperties: false
    PostVersions:
      type: object
      description: One version per channel; a missing channel has no version yet.
      properties:
        website:
          $ref: "#/components/schemas/WebsiteVersion"
        facebook:
          $ref: "#/components/schemas/FacebookVersion"
        instagram:
          $ref: "#/components/schemas/InstagramVersion"
        linkedin:
          $ref: "#/components/schemas/LinkedInVersion"
      additionalProperties: false
    ConsentInput:
      type: object
      description: "True Stories: the storyteller agreed to this post. Required before approval."
      required: [confirmed]
      properties:
        confirmed:
          type: boolean
        note:
          type: string
          description: Internal; where the consent is recorded.
          maxLength: 2000
      additionalProperties: false
    Consent:
      type: object
      required: [confirmed]
      properties:
        confirmed:
          type: boolean
        note:
          type: string
        confirmedAt:
          type: string
          description: UTC timestamp (RFC 3339).
          format: date-time
        confirmedBy:
          type: string
          format: uuid
      additionalProperties: false
    Publication:
      type: object
      description: How one channel's publishing is going.
      required: [channel, status, attempts, updatedAt]
      properties:
        channel:
          $ref: "#/components/schemas/Channel"
        status:
          $ref: "#/components/schemas/PublicationStatus"
        externalId:
          type: string
        permalink:
          type: string
        error:
          type: string
          description: >-
            Why the last attempt failed: `not_connected` (no platform connection; copy & open) or
            `connection_failed`.
        attempts:
          type: integer
        publishedAt:
          type: string
          description: UTC timestamp (RFC 3339).
          format: date-time
        updatedAt:
          type: string
          description: UTC timestamp (RFC 3339).
          format: date-time
      additionalProperties: false
    Post:
      type: object
      required: [id, title, kind, status, consent, versions, publications, version, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          description: Working title in the portal.
        kind:
          $ref: "#/components/schemas/PostKind"
        status:
          $ref: "#/components/schemas/PostStatus"
        scheduledAt:
          type: string
          description: UTC timestamp (RFC 3339).
          format: date-time
        consent:
          $ref: "#/components/schemas/Consent"
        reviewNote:
          type: string
          description: The reviewer's note from the last request for changes.
        authorId:
          type: string
          format: uuid
        approvedAt:
          type: string
          description: UTC timestamp (RFC 3339).
          format: date-time
        approvedBy:
          type: string
          format: uuid
        publishedAt:
          type: string
          description: UTC timestamp (RFC 3339) at which every enabled channel was published.
          format: date-time
        versions:
          $ref: "#/components/schemas/PostVersions"
        publications:
          type: array
          items:
            $ref: "#/components/schemas/Publication"
        version:
          $ref: "#/components/schemas/Version"
        createdAt:
          type: string
          description: UTC timestamp (RFC 3339).
          format: date-time
        updatedAt:
          type: string
          description: UTC timestamp (RFC 3339).
          format: date-time
      additionalProperties: false
    PostSummary:
      type: object
      required: [id, title, kind, status, channels, version, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        kind:
          $ref: "#/components/schemas/PostKind"
        status:
          $ref: "#/components/schemas/PostStatus"
        scheduledAt:
          type: string
          description: UTC timestamp (RFC 3339).
          format: date-time
        channels:
          type: array
          description: The enabled channels.
          items:
            $ref: "#/components/schemas/Channel"
        version:
          $ref: "#/components/schemas/Version"
        createdAt:
          type: string
          description: UTC timestamp (RFC 3339).
          format: date-time
        updatedAt:
          type: string
          description: UTC timestamp (RFC 3339).
          format: date-time
      additionalProperties: false
    PostList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PostSummary"
        nextCursor:
          type: string
      additionalProperties: false
    PostCreate:
      type: object
      required: [title, kind]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        kind:
          $ref: "#/components/schemas/PostKind"
        status:
          $ref: "#/components/schemas/DraftStatus"
        consent:
          $ref: "#/components/schemas/ConsentInput"
        versions:
          $ref: "#/components/schemas/PostVersions"
      additionalProperties: false
    PostPatch:
      type: object
      required: [version]
      properties:
        version:
          $ref: "#/components/schemas/Version"
        title:
          type: string
          minLength: 1
          maxLength: 200
        kind:
          $ref: "#/components/schemas/PostKind"
        status:
          $ref: "#/components/schemas/DraftStatus"
        consent:
          $ref: "#/components/schemas/ConsentInput"
        versions:
          $ref: "#/components/schemas/PostVersions"
      additionalProperties: false
    PostRequestChanges:
      type: object
      required: [version, note]
      properties:
        version:
          $ref: "#/components/schemas/Version"
        note:
          type: string
          minLength: 1
          maxLength: 2000
      additionalProperties: false
    PostSchedule:
      type: object
      required: [version, scheduledAt]
      properties:
        version:
          $ref: "#/components/schemas/Version"
        scheduledAt:
          type: string
          description: Must be in the future.
          format: date-time
      additionalProperties: false
    MarkPosted:
      type: object
      properties:
        permalink:
          type: string
          description: The post's address on the platform, if Daw Mi has it.
          format: uri
          maxLength: 2000
      additionalProperties: false
    PublicArticleSummary:
      type: object
      required: [slug, kind, title, excerpt, publishedAt]
      properties:
        slug:
          type: string
        kind:
          $ref: "#/components/schemas/PostKind"
        title:
          type: string
        excerpt:
          type: string
        coverImage:
          $ref: "#/components/schemas/PublicImage"
        publishedAt:
          type: string
          description: UTC timestamp (RFC 3339).
          format: date-time
      additionalProperties: false
    PublicArticle:
      type: object
      required: [slug, kind, title, excerpt, body, seoTitle, seoDescription, publishedAt]
      properties:
        slug:
          type: string
        kind:
          $ref: "#/components/schemas/PostKind"
        title:
          type: string
        excerpt:
          type: string
        body:
          type: string
          description: Markdown, as written.
        coverImage:
          $ref: "#/components/schemas/PublicImage"
        seoTitle:
          type: string
          description: The SEO title, or the title.
        seoDescription:
          type: string
          description: The SEO description, or the excerpt.
        publishedAt:
          type: string
          description: UTC timestamp (RFC 3339).
          format: date-time
      additionalProperties: false
    PublicArticleList:
      type: object
      required: [locale, items]
      properties:
        locale:
          $ref: "#/components/schemas/Locale"
        items:
          type: array
          items:
            $ref: "#/components/schemas/PublicArticleSummary"
      additionalProperties: false
    ImageSize:
      type: object
      required: [width, url]
      properties:
        width:
          type: integer
        url:
          type: string
          format: uri
      additionalProperties: false
    PublicImage:
      type: object
      description: A media library image as visitors see it.
      required: [id, alt, width, height, sizes]
      properties:
        id:
          type: string
          format: uuid
        alt:
          type: string
          description: In the requested locale, English as the fallback; empty for none.
        width:
          type: integer
          description: Of the stored original; with height, the aspect ratio.
        height:
          type: integer
        sizes:
          type: array
          description: JPEG web sizes, largest first.
          items:
            $ref: "#/components/schemas/ImageSize"
      additionalProperties: false
    Media:
      type: object
      required: [id, width, height, byteSize, sizes, version, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        width:
          type: integer
          description: Of the stored original, upright.
        height:
          type: integer
        byteSize:
          type: integer
          description: Of the upload.
        alt:
          $ref: "#/components/schemas/MediaAlt"
        credit:
          type: string
        sizes:
          type: array
          description: JPEG web sizes, largest first.
          items:
            $ref: "#/components/schemas/ImageSize"
        uploadedBy:
          type: string
          format: uuid
        version:
          $ref: "#/components/schemas/Version"
        createdAt:
          type: string
          description: UTC timestamp (RFC 3339).
          format: date-time
        updatedAt:
          type: string
          description: UTC timestamp (RFC 3339).
          format: date-time
      additionalProperties: false
    MediaList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Media"
        nextCursor:
          type: string
      additionalProperties: false
    MediaUpload:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: JPEG, PNG or WebP, at most 20 MB.
        altEn:
          type: string
          maxLength: 300
        altMy:
          type: string
          maxLength: 300
        credit:
          type: string
          maxLength: 300
    MediaPatch:
      type: object
      required: [version]
      properties:
        version:
          $ref: "#/components/schemas/Version"
        alt:
          $ref: "#/components/schemas/MediaAlt"
        credit:
          type: string
          maxLength: 300
      additionalProperties: false
    MediaAlt:
      type: object
      description: Alt text per locale.
      properties:
        en:
          type: string
          maxLength: 300
        my:
          type: string
          maxLength: 300
      additionalProperties: false
  responses:
    BadRequest:
      description: "`invalid_request`: the request does not match this contract."
      content:
        "application/problem+json":
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: "`unauthenticated` or `invalid_credentials`."
      content:
        "application/problem+json":
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: "`forbidden`: no role grants this route. No resource data is returned."
      content:
        "application/problem+json":
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: "`not_found`. Also returned for invalid or expired tokens, by design."
      content:
        "application/problem+json":
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: "`stale_version`, `invalid_transition`, `slug_taken`, `overlapping_period` or `in_use`."
      content:
        "application/problem+json":
          schema:
            $ref: "#/components/schemas/Problem"
    SlotUnavailable:
      description: "`slot_unavailable` (with alternatives), or `stale_version` / `invalid_transition`."
      content:
        "application/problem+json":
          schema:
            $ref: "#/components/schemas/SlotUnavailableProblem"
    PayloadTooLarge:
      description: "`payload_too_large`."
      content:
        "application/problem+json":
          schema:
            $ref: "#/components/schemas/Problem"
    UnsupportedMediaType:
      description: "`unsupported_media_type`."
      content:
        "application/problem+json":
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableEntity:
      description: "A business rule refused the request; see `code` and `errors`."
      content:
        "application/problem+json":
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: "`rate_limited`."
      headers:
        Retry-After:
          description: Seconds until the limit resets.
          schema:
            type: integer
            minimum: 1
      content:
        "application/problem+json":
          schema:
            $ref: "#/components/schemas/Problem"
    InternalError:
      description: "`internal_error` or `unavailable`; nothing was partly saved."
      content:
        "application/problem+json":
          schema:
            $ref: "#/components/schemas/Problem"
