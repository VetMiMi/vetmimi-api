        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
          maxLength: 120
        name:
          $ref: "#/components/schemas/LocalizedText"
        description:
          $ref: "#/components/schemas/LocalizedText"
        bookingAction:
          $ref: "#/components/schemas/BookingAction"
        durationMinutes:
          type: integer
          minimum: 5
          maximum: 480
        bufferBeforeMinutes:
          type: integer
          minimum: 0
          maximum: 240
        bufferAfterMinutes:
          type: integer
          minimum: 0
          maximum: 240
        formats:
          type: array
          items:
            $ref: "#/components/schemas/Format"
          minItems: 1
          uniqueItems: true
        feeText:
          $ref: "#/components/schemas/LocalizedText"
        preparationText:
          $ref: "#/components/schemas/LocalizedText"
        sortOrder:
          type: integer
        state:
          $ref: "#/components/schemas/ServiceState"
        version:
          $ref: "#/components/schemas/Version"
        createdAt:
          type: string
          description: UTC timestamp (RFC 3339).
          format: date-time
        updatedAt:
          type: string
          description: UTC timestamp (RFC 3339).
          format: date-time
      additionalProperties: false
    ServiceCreate:
      type: object
      required: [slug, name, bookingAction]
      properties:
        slug:
          type: string
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
          maxLength: 120
        name:
          $ref: "#/components/schemas/LocalizedText"
        description:
          $ref: "#/components/schemas/LocalizedText"
        bookingAction:
          $ref: "#/components/schemas/BookingAction"
        durationMinutes:
