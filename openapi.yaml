openapi: "3.1.0"
info:
  title: VetMiMi API
  version: "0.4.0"
  description: >-
    The API behind VetMiMi, Daw Mi's art therapy practice. The Next.js site is the only caller
    (ADR-002): public routes take the shared service key, admin routes a session token. The one
    exception is the video signaling WebSocket, which the browser opens with a short-lived room
    ticket (ADR-007).

    All timestamps are UTC in RFC 3339 (`format: date-time`). Responses about appointments and
    availability also carry the practice `timezone` (an IANA name, `Australia/Sydney` at launch) so
    the caller can display local times. Dates (`format: date`) are calendar dates in the practice
    timezone.

    Every error is an RFC 9457 `Problem` with a stable `code`; see docs/architecture.md for the
    list. Admin writes carry the `version` the caller last read; a mismatch is `409 stale_version`.
servers:
  - url: "http://localhost:8080"
    description: Local development
tags:
  - name: auth
    description: Administrator sign-in and sessions.
  - name: settings
    description: Business rules stored as settings rows.
  - name: services
    description: Bookable and enquiry-only services (booking configuration).
  - name: availability
    description: Weekly rules, one-off openings and date changes, blocked time, preview.
  - name: booking-public
    description: "Public booking: bookable services, slots, requests and management links."
  - name: appointments
    description: Appointment administration and the booking dashboard.
  - name: communications
    description: Communication history across appointments and enquiries.
  - name: video
    description: "One-to-one video sessions: join state, room tickets, signaling."
  - name: posts
    description: "The publishing portal: posts, their channel versions and the publishing workflow (ADR-009)."
  - name: articles
    description: Published website articles, read by the site.
  - name: media
    description: "The media library: images for posts, stored with web sizes."
  - name: contact
    description: Contact enquiries.
  - name: health
    description: Liveness and readiness.
paths:
  /healthz:
    get:
      tags: [health]
      operationId: getHealthz
      summary: Liveness check
      description: Returns 200 while the process can serve. Touches no dependency.
      security: []
      responses:
        "200":
          description: The process is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "500":
          $ref: "#/components/responses/InternalError"
  /readyz:
    get:
      tags: [health]
      operationId: getReadyz
      summary: Readiness check
      description: Pings PostgreSQL and Redis with a one-second timeout each.
      security: []
      responses:
        "200":
          description: PostgreSQL and Redis answered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: A dependency did not answer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
  /auth/sessions:
    post:
      tags: [auth]
      operationId: createSession
      summary: Sign in with password and TOTP
      description: "Called by the Next server. Any failure returns `401 invalid_credentials`."
      security:
        - serviceKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionCreate"
      responses:
        "201":
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /auth/sessions/current:
    delete:
      tags: [auth]
      operationId: deleteCurrentSession
      summary: Sign out
      security:
        - sessionToken: []
      responses:
        "204":
          description: Signed out.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /auth/me:
    get:
      tags: [auth]
      operationId: getCurrentUser
      summary: Get the signed-in user
      security:
        - sessionToken: []
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/settings:
    get:
      tags: [settings]
      operationId: getSettings
      summary: Get settings
      security:
        - sessionToken: []
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [settings]
      operationId: updateSettings
      summary: Change settings
      description: >-
        Changing `timezone` reinterprets weekly availability; existing appointments keep their
        instants.
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsPatch"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/services:
    get:
      tags: [services]
      operationId: listServices
      summary: List services
      security:
        - sessionToken: []
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [services]
      operationId: createService
      summary: Create a service
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceCreate"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  "/admin/services/{serviceId}":
    get:
      tags: [services]
      operationId: getService
      summary: Get a service
      security:
        - sessionToken: []
      parameters:
        - $ref: "#/components/parameters/ServiceId"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [services]
      operationId: updateService
      summary: Change a service
      description: >-
        New durations and buffers apply to future bookings only. `state` archives a service or
        brings an archived one back as `paused`; a refused change is `409 invalid_transition`.
      security:
        - sessionToken: []
      parameters:
        - $ref: "#/components/parameters/ServiceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServicePatch"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [services]
      operationId: deleteService
      summary: Delete a service
      description: "Refused with `409 in_use` once the service has appointments or a page; archive it instead."
      security:
        - sessionToken: []
      parameters:
        - $ref: "#/components/parameters/ServiceId"
      responses:
        "204":
          description: Deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  "/admin/services/{serviceId}/pause":
    post:
      tags: [services]
      operationId: pauseService
      summary: Pause bookings for a service
      description: "The service page stays published; existing appointments are untouched."
      security:
        - sessionToken: []
      parameters:
        - $ref: "#/components/parameters/ServiceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VersionedAction"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  "/admin/services/{serviceId}/resume":
    post:
      tags: [services]
      operationId: resumeService
      summary: Resume bookings for a service
      security:
        - sessionToken: []
      parameters:
        - $ref: "#/components/parameters/ServiceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VersionedAction"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/availability/rules:
    get:
      tags: [availability]
      operationId: listAvailabilityRules
      summary: List weekly availability periods
      security:
        - sessionToken: []
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityRuleList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [availability]
      operationId: createAvailabilityRule
      summary: Create a weekly availability period
      description: "Overlapping periods on the same weekday are refused with `409 overlapping_period`."
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvailabilityRuleInput"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityRule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  "/admin/availability/rules/{ruleId}":
    put:
      tags: [availability]
      operationId: updateAvailabilityRule
      summary: Replace a weekly availability period
      security:
        - sessionToken: []
      parameters:
        - $ref: "#/components/parameters/RuleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvailabilityRuleInput"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityRule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [availability]
      operationId: deleteAvailabilityRule
      summary: Delete a weekly availability period
      security:
        - sessionToken: []
      parameters:
        - $ref: "#/components/parameters/RuleId"
      responses:
        "204":
          description: Deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/availability/overrides:
    get:
      tags: [availability]
      operationId: listAvailabilityOverrides
      summary: List one-off openings and date changes
      security:
        - sessionToken: []
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityOverrideList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
      parameters:
        - name: from
          in: query
          required: false
          description: First local date to include.
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: Last local date to include.
          schema:
            type: string
            format: date
    post:
      tags: [availability]
      operationId: createAvailabilityOverride
      summary: Create a one-off opening or date change
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvailabilityOverrideInput"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityOverride"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  "/admin/availability/overrides/{overrideId}":
    put:
      tags: [availability]
      operationId: updateAvailabilityOverride
      summary: Replace a one-off opening or date change
      security:
        - sessionToken: []
      parameters:
        - $ref: "#/components/parameters/OverrideId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvailabilityOverrideInput"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityOverride"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [availability]
      operationId: deleteAvailabilityOverride
      summary: Delete a one-off opening or date change
      security:
        - sessionToken: []
      parameters:
        - $ref: "#/components/parameters/OverrideId"
      responses:
        "204":
          description: Deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/availability/blocks:
    get:
      tags: [availability]
      operationId: listAvailabilityBlocks
      summary: List blocked time
      security:
        - sessionToken: []
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityBlockList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
      parameters:
        - name: from
          in: query
          required: false
          description: First local date to include.
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: Last local date to include.
          schema:
            type: string
            format: date
    post:
      tags: [availability]
      operationId: createAvailabilityBlock
      summary: Create blocked time
      description: "Saved even when it overlaps appointments; the response lists them so the admin can act."
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvailabilityBlockInput"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityBlockSaved"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  "/admin/availability/blocks/{blockId}":
    put:
      tags: [availability]
      operationId: updateAvailabilityBlock
      summary: Replace blocked time
      security:
        - sessionToken: []
      parameters:
        - $ref: "#/components/parameters/BlockId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvailabilityBlockInput"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityBlockSaved"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [availability]
      operationId: deleteAvailabilityBlock
      summary: Delete blocked time
      security:
        - sessionToken: []
      parameters:
        - $ref: "#/components/parameters/BlockId"
      responses:
        "204":
          description: Deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/availability/preview:
    get:
      tags: [availability]
      operationId: previewAvailability
      summary: Preview public availability
      security:
        - sessionToken: []
      parameters:
        - name: serviceId
          in: query
          required: true
          description: Service to preview.
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          required: true
          description: First local date.
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          description: "Last local date; at most 62 days after `from`."
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityPreview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /public/booking/services:
    get:
      tags: [booking-public]
      operationId: listPublicBookableServices
      summary: List services that can be booked or requested
      description: "Only active services whose action is `book` or `request`. Empty while booking is paused."
      security:
        - serviceKey: []
      parameters:
        - $ref: "#/components/parameters/Locale"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicBookableServiceList"
        "400":
          $ref: "#/components/responses/BadRequest"
