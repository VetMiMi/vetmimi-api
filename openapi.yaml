  "/video/rooms/{roomId}/ws":
    get:
      tags: [video]
      operationId: connectVideoRoom
      summary: Open the signaling WebSocket for a video room
      description: >-
        The one route the browser calls directly (ADR-002, ADR-007). Requires `Origin` to be the
        site and a valid ticket for this room. Mounted outside the timeout and OpenAPI validation
        middleware and excluded from strict-server generation; at most one connection per role.
      security: []
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - name: ticket
          in: query
          required: true
          description: "Room ticket from `createRoomTicket` or `startVideoSession`."
          schema:
            type: string
            maxLength: 1000
      responses:
        "101":
          description: >-
            Switching protocols to WebSocket. An invalid or expired ticket, or a room that has
            ended or closed, is refused after the upgrade with close code `4001` or `4002`, because
            a browser cannot read the status of a refused handshake.
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
      x-websocket-messages:
        description: >-
          JSON text frames, at most 16 KiB. Relayed to the other participant, never stored or
          logged.
        clientToServer:
          join:
            type: object
            description: Sent once after the socket opens.
            required: [type]
            properties:
              type:
                type: string
                enum: [join]
            additionalProperties: false
          offer:
            type: object
            required: [type, sdp]
            properties:
              type:
                type: string
                enum: [offer]
              sdp:
                type: string
            additionalProperties: false
          answer:
            type: object
            required: [type, sdp]
            properties:
              type:
                type: string
                enum: [answer]
              sdp:
                type: string
            additionalProperties: false
          ice:
            type: object
            required: [type, candidate]
            properties:
              type:
                type: string
                enum: [ice]
              candidate:
                type: object
                required: [candidate]
                properties:
                  candidate:
                    type: string
                  sdpMid:
                    type: string
                  sdpMLineIndex:
                    type: integer
                additionalProperties: false
            additionalProperties: false
          leave:
            type: object
            required: [type]
            properties:
              type:
                type: string
                enum: [leave]
            additionalProperties: false
        serverToClient:
          offer: Relayed from the other participant, unchanged.
          answer: Relayed from the other participant, unchanged.
          ice: Relayed from the other participant, unchanged.
          leave: The other participant left on purpose.
          peer-state:
            type: object
            description: Sent on every join, leave and room change.
            required: [type, client, practitioner, room]
            properties:
              type:
                type: string
                enum: [peer-state]
              client:
                type: string
                enum: [connected, disconnected]
              practitioner:
                type: string
                enum: [connected, disconnected]
              room:
                type: string
                enum: [waiting, in_session, ended]
            additionalProperties: false
        closeCodes:
          "4000": replaced by a newer connection for the same role
          "4001": ticket invalid or expired
          "4002": room ended
          "1001": server restarting; reconnect with a fresh ticket
          "1008": message invalid or sent before join
          "1009": message too large
