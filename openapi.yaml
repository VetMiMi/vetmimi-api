  /admin/media:
    get:
      tags: [media]
      operationId: listMedia
      summary: List the media library
      description: Newest first. `q` searches the alt text in either language and the credit.
      security:
        - sessionToken: []
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [media]
      operationId: uploadMedia
      summary: Upload an image
      description: >-
        A JPEG, PNG or WebP image of at most 20 MB and 50 megapixels, recognised from its content.
        It is turned upright and re-encoded as JPEG, which drops its metadata (camera, time,
        location): the original is kept privately and web sizes 1600, 800 and 400 pixels wide (never
        wider than the image) are public. Mounted by hand with a 21 MiB body cap and a 120-second
        timeout, and excluded from strict-server generation.
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/MediaUpload"
      responses:
        "201":
          description: Stored with its web sizes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Media"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  "/admin/media/{mediaId}":
    get:
      tags: [media]
      operationId: getMedia
      summary: Get a media item
      security:
        - sessionToken: []
      parameters:
        - $ref: "#/components/parameters/MediaId"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Media"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [media]
      operationId: updateMedia
      summary: Describe a media item
      description: Replaces the alt text and credit; one left out is cleared.
      security:
        - sessionToken: []
      parameters:
        - $ref: "#/components/parameters/MediaId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaPatch"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Media"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [media]
      operationId: deleteMedia
      summary: Delete a media item
      description: >-
        Removes the row and every stored file. Refused with `409 in_use` while any post, whatever its
        status, uses the image.
      security:
        - sessionToken: []
      parameters:
        - $ref: "#/components/parameters/MediaId"
      responses:
        "204":
          description: Deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /public/articles:
    get:
      tags: [articles]
      operationId: listPublicArticles
      summary: List published articles
      description: >-
        Website versions of published posts only, newest first, in `locale` with English as the
        fallback.
      security:
        - serviceKey: []
      parameters:
        - $ref: "#/components/parameters/Locale"
        - $ref: "#/components/parameters/PostKindFilter"
        - $ref: "#/components/parameters/ArticleLimit"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicArticleList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  "/public/articles/{slug}":
    get:
      tags: [articles]
      operationId: getPublicArticle
      summary: Get a published article
      description: >-
        In `locale` with English as the fallback. An unpublished or archived article is `404`.
      security:
        - serviceKey: []
      parameters:
        - $ref: "#/components/parameters/ArticleSlug"
        - $ref: "#/components/parameters/Locale"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicArticle"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    serviceKey:
      type: apiKey
      in: header
      name: X-Service-Key
      description: >-
        Shared secret held by the Next.js server. Required on `/public/*` and `POST /auth/sessions`.
        Requests with a valid key may carry `X-Visitor-IP`, the visitor's address, which public rate
        limits use.
    sessionToken:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: >-
        Session token from `POST /auth/sessions`. Required on `/admin/*` and `/auth/*` except
        sign-in.
  parameters:
    AppointmentId:
      name: appointmentId
      in: path
      required: true
      description: Appointment id.
      schema:
        type: string
        format: uuid
    ServiceId:
      name: serviceId
      in: path
      required: true
      description: Service id.
      schema:
        type: string
        format: uuid
    RuleId:
      name: ruleId
      in: path
      required: true
      description: Availability rule id.
      schema:
        type: string
        format: uuid
    OverrideId:
      name: overrideId
      in: path
      required: true
      description: Availability override id.
      schema:
        type: string
        format: uuid
    BlockId:
      name: blockId
      in: path
      required: true
      description: Availability block id.
      schema:
        type: string
        format: uuid
    CommunicationId:
      name: communicationId
      in: path
      required: true
      description: Communication id.
      schema:
        type: string
        format: uuid
    EnquiryId:
      name: enquiryId
      in: path
      required: true
      description: Contact enquiry id.
      schema:
        type: string
        format: uuid
    RoomId:
      name: roomId
      in: path
      required: true
      description: Video room id.
      schema:
        type: string
        format: uuid
    ManagementToken:
      name: token
      in: path
      required: true
      description: Management link token (43 base64url characters). Invalid and expired tokens both give 404.
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{43}$"
    JoinToken:
      name: token
      in: path
      required: true
      description: Video join token from the visitor's email (43 base64url characters).
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{43}$"
    Locale:
      name: locale
      in: query
      required: false
      description: "Language of the localised fields; English is the fallback."
      schema:
        $ref: "#/components/schemas/Locale"
    Cursor:
      name: cursor
      in: query
      required: false
      description: "Opaque cursor from a previous page's `nextCursor`."
      schema:
        type: string
        maxLength: 200
    Limit:
      name: limit
      in: query
      required: false
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Search:
      name: q
      in: query
      required: false
      description: Case-insensitive search text.
      schema:
        type: string
        maxLength: 100
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Client-generated UUID, reused for retries of the same submission. A repeat with the same
        body within 24 hours returns the stored response; with a different body it returns `422
        idempotency_key_reused`.
      schema:
        type: string
        format: uuid
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      description: "Optional client-generated UUID; same semantics as for appointment requests."
      schema:
        type: string
        format: uuid
    MediaId:
      name: mediaId
      in: path
      required: true
      description: Media id.
      schema:
        type: string
        format: uuid
    PostId:
      name: postId
      in: path
      required: true
      description: Post id.
      schema:
        type: string
        format: uuid
    PostStatusFilter:
      name: status
      in: query
      required: false
      description: Only posts in this status.
      schema:
        $ref: "#/components/schemas/PostStatus"
    SocialChannel:
      name: channel
      in: path
      required: true
      description: A social channel; the website publishes itself.
      schema:
        $ref: "#/components/schemas/SocialChannel"
    PostKindFilter:
      name: kind
      in: query
      required: false
      description: Only articles of this kind.
      schema:
        $ref: "#/components/schemas/PostKind"
    ArticleLimit:
      name: limit
      in: query
      required: false
      description: Maximum items.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 100
    ArticleSlug:
      name: slug
      in: path
      required: true
      description: The website version's slug.
      schema:
        type: string
        pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
        maxLength: 120
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details, returned by every 4xx and 5xx response.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          description: "URI identifying the problem type: `urn:vetmimi:problem:<code>`."
          format: uri
        title:
          type: string
          description: Short summary of the problem type.
        status:
          type: integer
          description: HTTP status code.
          minimum: 400
          maximum: 599
        detail:
          type: string
          description: "Explanation for an administrator or developer; never shown raw to visitors."
        code:
          type: string
          description: "Stable machine-readable code, e.g. `slot_unavailable`."
          pattern: "^[a-z_]+$"
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
                description: JSON pointer or parameter name.
              message:
                type: string
            additionalProperties: false
          description: Field-level problems.
    SlotUnavailableProblem:
      description: "A `Problem` with code `slot_unavailable` and nearby free slots."
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [alternatives]
          properties:
            alternatives:
              type: array
              items:
                $ref: "#/components/schemas/Slot"
              description: Up to five free slots on the same or following days.
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
      additionalProperties: false
    Readiness:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        checks:
          type: object
          required: [postgres, redis]
          properties:
            postgres:
              type: string
              enum: [ok, fail]
            redis:
              type: string
              enum: [ok, fail]
          additionalProperties: false
      additionalProperties: false
    Locale:
      type: string
      description: "Site language: English or Burmese."
      enum: [en, my]
      default: en
    LocalizedText:
      type: object
      description: "Text per locale. Required fields need `en`."
      properties:
        en:
          type: string
          maxLength: 20000
        my:
          type: string
          maxLength: 20000
      additionalProperties: false
    Timezone:
      type: string
      description: IANA timezone name of the practice.
      examples: [Australia/Sydney]
    Version:
      type: integer
      description: Row version for optimistic concurrency.
      minimum: 1
    Role:
      type: string
      enum: [content_editor, booking_admin, site_admin]
    Format:
      type: string
      description: Appointment format. Online only at launch.
      enum: [online, in_person]
    Slot:
      type: object
      description: "A bookable time; `endsAt` is the session end, buffers excluded."
      required: [startsAt, endsAt]
      properties:
        startsAt:
          type: string
          description: UTC timestamp (RFC 3339).
          format: date-time
        endsAt:
          type: string
          description: UTC timestamp (RFC 3339).
          format: date-time
      additionalProperties: false
    SlotDay:
      type: object
      required: [date, slots]
      properties:
        date:
          type: string
          description: Calendar date in the practice timezone.
          format: date
        slots:
          type: array
          items:
            $ref: "#/components/schemas/Slot"
      additionalProperties: false
    SessionCreate:
      type: object
      required: [email, password, totpCode]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 12
          maxLength: 200
          format: password
        totpCode:
          type: string
          pattern: "^[0-9]{6}$"
      additionalProperties: false
    CurrentUser:
      type: object
      required: [id, email, displayName, roles, isPractitioner]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
          minItems: 1
        isPractitioner:
          type: boolean
      additionalProperties: false
    SessionCreated:
      type: object
      required: [token, expiresAt, user]
      properties:
        token:
          type: string
          description: "Opaque session token (`vms_` + 43 base64url characters). Shown once."
          pattern: "^vms_[A-Za-z0-9_-]{43}$"
        expiresAt:
          type: string
          description: "Absolute expiry; the session also ends after 12 hours idle."
          format: date-time
        user:
          $ref: "#/components/schemas/CurrentUser"
      additionalProperties: false
    Settings:
      type: object
      description: >-
        All settings; keys are the camelCase form of the `settings` table keys. A content editor
        receives only the `site` group (timezone, retentionMonths, contactEmail, responseTime);
        booking and site administrators receive every key. `updatedAt` is the newest change among
        the keys returned.
      required:
        - timezone
        - retentionMonths
        - contactEmail
        - responseTime
      properties:
        timezone:
          $ref: "#/components/schemas/Timezone"
        bookingMode:
          type: string
          enum: [request_approval, instant]
        publicBookingEnabled:
          type: boolean
          description: False pauses public booking without touching availability.
        pendingHoldHours:
          type: integer
          minimum: 1
          maximum: 168
        reminderHours:
          type: integer
          minimum: 1
          maximum: 168
        minNoticeHours:
          type: integer
          minimum: 0
          maximum: 720
        maxAdvanceDays:
          type: integer
          minimum: 1
          maximum: 365
        slotStepMinutes:
          type: integer
          minimum: 5
          maximum: 120
        cancellationNoticeHours:
          type: integer
          minimum: 0
          maximum: 168
        lateCancellationFeePercent:
          type: integer
          minimum: 0
          maximum: 100
        lateCancellationFirstWaived:
          type: boolean
        noShowFeePercent:
          type: integer
          minimum: 0
          maximum: 100
        meetingLinkMode:
          type: string
          enum: [vetmimi_room, manual_link]
        paymentMethods:
          type: array
          items:
            type: string
            enum: [bank_transfer, card]
          minItems: 1
          uniqueItems: true
        invoiceTiming:
          type: string
          enum: [after_session]
        retentionMonths:
          type: integer
          minimum: 6
          maximum: 120
        contactEmail:
          type: string
          format: email
        responseTime:
          $ref: "#/components/schemas/LocalizedText"
        updatedAt:
          type: string
          description: UTC timestamp (RFC 3339).
          format: date-time
      additionalProperties: false
    SettingsPatch:
      type: object
      description: >-
        Keys to change, applied together or not at all. `booking` keys need booking_admin; `site`
        keys need site_admin.
      minProperties: 1
      properties:
        timezone:
          $ref: "#/components/schemas/Timezone"
        bookingMode:
          type: string
          enum: [request_approval, instant]
        publicBookingEnabled:
          type: boolean
          description: False pauses public booking without touching availability.
        pendingHoldHours:
          type: integer
          minimum: 1
          maximum: 168
        reminderHours:
          type: integer
          minimum: 1
          maximum: 168
        minNoticeHours:
          type: integer
          minimum: 0
          maximum: 720
        maxAdvanceDays:
          type: integer
          minimum: 1
          maximum: 365
        slotStepMinutes:
          type: integer
          minimum: 5
          maximum: 120
        cancellationNoticeHours:
          type: integer
          minimum: 0
          maximum: 168
        lateCancellationFeePercent:
          type: integer
          minimum: 0
          maximum: 100
        lateCancellationFirstWaived:
          type: boolean
        noShowFeePercent:
          type: integer
          minimum: 0
          maximum: 100
        meetingLinkMode:
          type: string
          enum: [vetmimi_room, manual_link]
        paymentMethods:
          type: array
          items:
            type: string
            enum: [bank_transfer, card]
          minItems: 1
          uniqueItems: true
        invoiceTiming:
          type: string
          enum: [after_session]
        retentionMonths:
          type: integer
          minimum: 6
          maximum: 120
        contactEmail:
          type: string
          format: email
        responseTime:
          $ref: "#/components/schemas/LocalizedText"
      additionalProperties: false
    BookingAction:
      type: string
      enum: [book, request, enquiry_only, not_bookable]
    ServiceState:
      type: string
      enum: [active, paused, archived]
    Service:
      type: object
      required:
        - id
        - slug
        - name
        - bookingAction
        - state
        - bufferBeforeMinutes
        - bufferAfterMinutes
        - formats
        - sortOrder
        - version
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
          maxLength: 120
        name:
          $ref: "#/components/schemas/LocalizedText"
        description:
          $ref: "#/components/schemas/LocalizedText"
        bookingAction:
          $ref: "#/components/schemas/BookingAction"
        durationMinutes:
          type: integer
          minimum: 5
          maximum: 480
        bufferBeforeMinutes:
          type: integer
          minimum: 0
          maximum: 240
        bufferAfterMinutes:
          type: integer
          minimum: 0
          maximum: 240
        formats:
          type: array
          items:
            $ref: "#/components/schemas/Format"
          minItems: 1
          uniqueItems: true
        feeText:
          $ref: "#/components/schemas/LocalizedText"
        preparationText:
          $ref: "#/components/schemas/LocalizedText"
        sortOrder:
          type: integer
        state:
          $ref: "#/components/schemas/ServiceState"
        version:
          $ref: "#/components/schemas/Version"
        createdAt:
          type: string
          description: UTC timestamp (RFC 3339).
          format: date-time
        updatedAt:
          type: string
          description: UTC timestamp (RFC 3339).
          format: date-time
      additionalProperties: false
    ServiceCreate:
      type: object
      required: [slug, name, bookingAction]
      properties:
        slug:
          type: string
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
          maxLength: 120
        name:
          $ref: "#/components/schemas/LocalizedText"
        description:
          $ref: "#/components/schemas/LocalizedText"
        bookingAction:
          $ref: "#/components/schemas/BookingAction"
        durationMinutes:
          type: integer
          minimum: 5
          maximum: 480
        bufferBeforeMinutes:
          type: integer
          minimum: 0
          maximum: 240
        bufferAfterMinutes:
          type: integer
          minimum: 0
          maximum: 240
        formats:
          type: array
          items:
            $ref: "#/components/schemas/Format"
          minItems: 1
          uniqueItems: true
        feeText:
          $ref: "#/components/schemas/LocalizedText"
        preparationText:
          $ref: "#/components/schemas/LocalizedText"
        sortOrder:
          type: integer
      additionalProperties: false
    ServicePatch:
      type: object
      required: [version]
      properties:
        version:
          $ref: "#/components/schemas/Version"
        slug:
          type: string
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
          maxLength: 120
        name:
          $ref: "#/components/schemas/LocalizedText"
        description:
          $ref: "#/components/schemas/LocalizedText"
        bookingAction:
          $ref: "#/components/schemas/BookingAction"
        durationMinutes:
          type: integer
          minimum: 5
          maximum: 480
        bufferBeforeMinutes:
          type: integer
          minimum: 0
          maximum: 240
        bufferAfterMinutes:
          type: integer
          minimum: 0
          maximum: 240
        formats:
          type: array
          items:
            $ref: "#/components/schemas/Format"
          minItems: 1
          uniqueItems: true
        feeText:
          $ref: "#/components/schemas/LocalizedText"
        preparationText:
          $ref: "#/components/schemas/LocalizedText"
        sortOrder:
          type: integer
        state:
          $ref: "#/components/schemas/ServiceState"
      additionalProperties: false
    ServiceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Service"
      additionalProperties: false
    VersionedAction:
      type: object
      required: [version]
      properties:
        version:
          $ref: "#/components/schemas/Version"
      additionalProperties: false
    AvailabilityRuleInput:
      type: object
      required: [weekday, startTime, endTime]
      properties:
        weekday:
          type: integer
          description: "ISO weekday, 1 = Monday … 7 = Sunday."
          minimum: 1
          maximum: 7
        startTime:
          type: string
          description: "Local time `HH:MM` in the practice timezone."
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        endTime:
          type: string
          description: "Local time `HH:MM` in the practice timezone."
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
      additionalProperties: false
    AvailabilityRule:
      type: object
      required: [weekday, startTime, endTime, id]
      properties:
        weekday:
          type: integer
          description: "ISO weekday, 1 = Monday … 7 = Sunday."
          minimum: 1
          maximum: 7
        startTime:
          type: string
          description: "Local time `HH:MM` in the practice timezone."
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        endTime:
