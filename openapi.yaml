        startsAt:
          type: string
          description: UTC timestamp (RFC 3339).
          format: date-time
        endsAt:
          type: string
          description: UTC timestamp (RFC 3339).
          format: date-time
        note:
          type: string
          description: Private.
          maxLength: 500
      additionalProperties: false
    AvailabilityOverride:
      type: object
      required: [onDate, kind, startsAt, endsAt, id, createdAt]
      properties:
        onDate:
          type: string
          description: Calendar date in the practice timezone.
          format: date
        kind:
          type: string
          description: "`open` adds time on the date; `replace` rows replace that date's weekly hours."
          enum: [open, replace]
        startsAt:
          type: string
          description: UTC timestamp (RFC 3339).
          format: date-time
        endsAt:
          type: string
          description: UTC timestamp (RFC 3339).
          format: date-time
        note:
          type: string
          description: Private.
          maxLength: 500
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          description: UTC timestamp (RFC 3339).
          format: date-time
      additionalProperties: false
    AvailabilityOverrideList:
      type: object
      required: [timezone, items]
      properties:
        timezone:
          $ref: "#/components/schemas/Timezone"
        items:
          type: array
          items:
            $ref: "#/components/schemas/AvailabilityOverride"
      additionalProperties: false
    AvailabilityBlockInput:
      type: object
      required: [startsAt, endsAt]
      properties:
        startsAt:
          type: string
          description: UTC timestamp (RFC 3339).
          format: date-time
        endsAt:
          type: string
          description: UTC timestamp (RFC 3339).
          format: date-time
        allDay:
          type: boolean
          description: "Created as whole local days; display only."
          default: false
        reason:
          type: string
          description: "Private; never shown publicly."
          maxLength: 500
      additionalProperties: false
    AvailabilityBlock:
      type: object
      required: [startsAt, endsAt, id, createdAt]
      properties:
        startsAt:
          type: string
          description: UTC timestamp (RFC 3339).
          format: date-time
        endsAt:
          type: string
          description: UTC timestamp (RFC 3339).
          format: date-time
        allDay:
          type: boolean
          description: "Created as whole local days; display only."
          default: false
        reason:
          type: string
          description: "Private; never shown publicly."
          maxLength: 500
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          description: UTC timestamp (RFC 3339).
          format: date-time
      additionalProperties: false
    AvailabilityBlockList:
      type: object
      required: [timezone, items]
      properties:
        timezone:
          $ref: "#/components/schemas/Timezone"
        items:
          type: array
          items:
            $ref: "#/components/schemas/AvailabilityBlock"
      additionalProperties: false
    AvailabilityBlockSaved:
      type: object
      required: [block, conflicts]
      properties:
        block:
          $ref: "#/components/schemas/AvailabilityBlock"
        conflicts:
          type: array
          items:
            $ref: "#/components/schemas/AppointmentSummary"
          description: Pending or confirmed appointments the block overlaps. They are not changed.
